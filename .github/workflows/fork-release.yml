name: fork-release

# 每 30 分钟用 ubuntu 轻量检查上游版本；只有上游版本变化（或手动 force）才启动 macOS 构建并发版。
# 自动完成：合并上游 → 应用定制 → 构建 darwin-arm64 → GitHub Release（不发 npm/brew）。
on:
   schedule:
      - cron: "*/30 * * * *"
   push:
      tags:
         - "fork-build-*"
   workflow_dispatch:
      inputs:
         force:
            description: "Rebuild the current upstream version as a new fork release"
            type: boolean
            default: false

permissions:
   contents: write
   actions: write


env:
   UPSTREAM_REPO: can1357/oh-my-pi
   TARGET: darwin-arm64
   BUN_VERSION: 1.4.4

jobs:
   check:
      name: Check upstream version
      runs-on: ubuntu-22.04
      outputs:
         release: ${{ steps.decide.outputs.release }}
      steps:

         - name: Compare upstream version with this fork's latest release
           id: decide
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
           run: |
              set -euo pipefail
              BASE=$(curl -fsSL "https://raw.githubusercontent.com/${UPSTREAM_REPO}/main/packages/coding-agent/package.json" | jq -r .version)
              LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
              LAST_BASE=${LAST#v}
              LAST_BASE=${LAST_BASE%-fork.*}
              echo "upstream=$BASE latest-fork=${LAST:-none}"
              if [ -n "$BASE" ] && { [ "$LAST_BASE" != "$BASE" ] || [ "$FORCE" = "true" ]; }; then
                echo "release=true" >> "$GITHUB_OUTPUT"
              else
                echo "release=false" >> "$GITHUB_OUTPUT"
              fi

   release:
      name: Build and release
      needs: check
      if: needs.check.outputs.release == 'true'
      runs-on: macos-15
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Sync upstream sources
           run: |
              git config user.name "fork-release"
              git config user.email "fork-release@users.noreply.github.com"
              git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
              git fetch --no-tags upstream main
              git merge --no-edit upstream/main

         - name: Resolve fork version
           id: version
           env:
              FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
           run: |
              set -euo pipefail
              BASE=$(node -p "require('./packages/coding-agent/package.json').version")
              REL=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
              TAG=$(git tag --list --sort=-v:refname 'v*-fork.*' | head -1)
              REL_BASE=${REL#v}; REL_BASE=${REL_BASE%-fork.*}
              if [ -n "$REL" ] && [ "$REL_BASE" = "$BASE" ] && [ "$FORCE" != "true" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "upstream $BASE already released as $REL; skipping"
                exit 0
              fi
              N=1
              for CAND in "$REL" "$TAG"; do
                [ -z "$CAND" ] && continue
                CAND_BASE=${CAND#v}; CAND_BASE=${CAND_BASE%-fork.*}
                CAND_N=${CAND##*-fork.}
                if [ "$CAND_BASE" = "$BASE" ] && [ "$CAND_N" -ge 1 ] && [ $(( CAND_N + 1 )) -gt "$N" ]; then
                  N=$(( CAND_N + 1 ))
                fi
              done
              VERSION="${BASE}-fork.${N}"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "releasing v$VERSION"

         - name: Apply fork customizations
           if: steps.version.outputs.skip != 'true'
           run: |
              node fork/apply-customizations.mjs \
                --repo "$GITHUB_REPOSITORY" \
                --version "${{ steps.version.outputs.version }}"

         - uses: oven-sh/setup-bun@v2
           if: steps.version.outputs.skip != 'true'
           with:
              bun-version: ${{ env.BUN_VERSION }}

         - name: Install dependencies
           if: steps.version.outputs.skip != 'true'
           run: bun install

         - name: Build host native addon
           if: steps.version.outputs.skip != 'true'
           run: bun --cwd=packages/natives run build

         - name: Build release binary
           if: steps.version.outputs.skip != 'true'
           env:
              RELEASE_TARGETS: ${{ env.TARGET }}
           run: bun run ci:release:build-binaries

         - name: Write checksum
           if: steps.version.outputs.skip != 'true'
           run: |
              cd packages/coding-agent/binaries
              shasum -a 256 "omp-${TARGET}" > "omp-${TARGET}.sha256"

         - name: Create tag and GitHub Release
           if: steps.version.outputs.skip != 'true'
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              VERSION: ${{ steps.version.outputs.version }}
           run: |
              set -euo pipefail
              git tag "v${VERSION}"
              git push origin "v${VERSION}"
              gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
                "packages/coding-agent/binaries/omp-${TARGET}" \
                "packages/coding-agent/binaries/omp-${TARGET}.sha256" \
                --title "omp ${VERSION}" \
                --notes "Fork build of upstream ${VERSION%%-fork.*} with ACP auto session titles, fork self-update, and fork native-addon downloads." \
                --latest
